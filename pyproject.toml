[project]
name = "campaign_experiment"
version = "0.1.0"
description = "Pre-registered analysis of a randomised email campaign: power, validity checks, inference, CUPED, segment effects and a rollout decision."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
campaign-experiment = "campaign_experiment.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
campaign_experiment = ["sql/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: bugbear
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -m 'not network'"
markers = [
    "network: downloads the real dataset; run with `pytest -m network`",
]
