name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Format check
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      # Unit tests run on synthetic data with known effects, so CI needs no
      # network. The real-data test is marked `network` and excluded here.
      - name: Tests
        run: pytest
